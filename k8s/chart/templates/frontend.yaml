{{- $transit := ternary "1" "0" (not (empty (index .Values.artifacts "otp-graphs"))) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: frontend
      {{- with $.Values.restartedAt }}
      annotations:
        kubectl.kubernetes.io/restartedAt: {{ . | quote }}
      {{- end }}
    spec:
      volumes:
        - name: headway-volume
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                resources:
                  requests:
                    storage: 50Mi
      initContainers:
        - name: init
          image: {{ include "headway.image" (list $ "headway-init") }}
          imagePullPolicy: Always
          volumeMounts:
            - name: headway-volume
              mountPath: /data
          env:
            - name: HEADWAY_BBOX
              value: {{ .Values.frontend.bbox | quote }}
            - name: HEADWAY_ENABLE_TRANSIT_ROUTING
              value: {{ $transit | quote }}
            - name: HEADWAY_ABOUT_URL
              value: {{ .Values.frontend.aboutUrl | quote }}
            - name: HEADWAY_ABOUT_LINK_TEXT
              value: {{ .Values.frontend.aboutLinkText | quote }}
            - name: HEADWAY_CONTACT_URL
              value: {{ .Values.frontend.contactUrl | quote }}
            - name: HEADWAY_CONTACT_LINK_TEXT
              value: {{ .Values.frontend.contactLinkText | quote }}
          resources:
            limits:
              memory: 100Mi
            requests:
              memory: 100Mi
      containers:
        - name: main
          image: {{ include "headway.image" (list $ "headway") }}
          imagePullPolicy: Always
          volumeMounts:
            - name: headway-volume
              mountPath: /data
          ports:
            - containerPort: 8080
          env:
            - name: HEADWAY_TILESERVER_URL
              value: http://tileserver:8000
            - name: HEADWAY_PELIAS_URL
              value: http://pelias-api:4000
            - name: HEADWAY_TRANSIT_ZONER_URL
              value: http://transit-zoner:8420
            - name: HEADWAY_PUBLIC_URL
              value: {{ .Values.frontend.publicUrl | quote }}
            - name: HEADWAY_ENABLE_TRANSIT_ROUTING
              value: {{ $transit | quote }}
          resources:
            limits:
              memory: 300Mi
            requests:
              memory: 100Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: {{ .Values.frontend.servicePort }}
