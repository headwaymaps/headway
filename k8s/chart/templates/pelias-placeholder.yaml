{{- $artifact := include "headway.artifact" (list $ "placeholder") -}}
{{- $claim := include "headway.claim" (list $ "placeholder" $artifact) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias-placeholder
spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: pelias-placeholder
  template:
    metadata:
      labels:
        app: pelias-placeholder
      {{- with $.Values.restartedAt }}
      annotations:
        kubectl.kubernetes.io/restartedAt: {{ . | quote }}
      {{- end }}
    spec:
      initContainers:
        - name: init
          image: {{ include "headway.image" (list $ "pelias-init") }}
          imagePullPolicy: Always
          volumeMounts:
            - name: placeholder-volume
              mountPath: /data
            - name: config-volume
              mountPath: /config
          env:
            - name: PELIAS_CONFIG_ARTIFACT_URL
              value: {{ include "headway.artifact" (list $ "pelias-config") | quote }}
            - name: PLACEHOLDER_ARTIFACT_URL
              value: {{ $artifact | quote }}
          command: ["/bin/bash", "-c", "/app/init_config.sh && /app/init_placeholder.sh" ]
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 200Mi
      containers:
        - name: main
          image: pelias/placeholder:master
          ports:
            - containerPort: 4100
          volumeMounts:
            - name: placeholder-volume
              mountPath: /data
            - name: config-volume
              mountPath: /config
          env:
            - name: PLACEHOLDER_DATA
              value: "/data/placeholder/"
            - name: PORT
              value: "4100"
          resources:
            limits:
              memory: 1000Mi
            requests:
              memory: 400Mi
          livenessProbe:
            httpGet:
              path: /demo/
              port: 4100
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /demo/
              port: 4100
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: placeholder-volume
          persistentVolumeClaim:
            claimName: {{ $claim }}
        {{- include "headway.configVolume" . | nindent 8 }}
---
{{ include "headway.pvc" (list $claim "40Gi") }}
---
{{ include "headway.service" (list "pelias-placeholder" 4100) }}
