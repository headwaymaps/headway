apiVersion: apps/v1
kind: Deployment
metadata:
  name: tileserver
spec:
  selector:
    matchLabels:
      app: tileserver
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge a new pod before retiring the old. On a version bump the two pods
      # claim *different* PVCs, so the new one downloads its artifact while the
      # old keeps serving. On a same-version restart they share one ReadWriteOnce
      # claim: fine, since the scheduler only places them where it can attach.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tileserver
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/tileserver-init:maps-earth-dev
          imagePullPolicy: Always
          volumeMounts:
            - name: tileserver-volume
              mountPath: /data
          env:
            - name: TERRAIN_ARTIFACT_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: deployment-config
                  key: terrain-source-url
            - name: TERRAIN_ARTIFACT_DEST
              value: /data/tiles/terrain.mbtiles
            - name: LANDCOVER_ARTIFACT_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: deployment-config
                  key: landcover-source-url
            - name: LANDCOVER_ARTIFACT_DEST
              value: /data/tiles/landcover.mbtiles
            - name: AREAMAP_ARTIFACT_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: deployment-config
                  key: areamap-source-url
            - name: AREAMAP_ARTIFACT_DEST
              value: /data/tiles/areamap.pmtiles
          resources:
            limits:
              memory: 200Mi
            requests:
              memory: 100Mi
      containers:
        - name: tileserver
          image: ghcr.io/headwaymaps/tileserver:maps-earth-dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: tileserver-volume
              mountPath: /data
          env:
            - name: PORT
              value: "8000"
          resources:
            limits:
              memory: 1500Mi
            requests:
              memory: 250Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: tileserver-volume
          persistentVolumeClaim:
            claimName: tileserver-seattle-latest-dev
