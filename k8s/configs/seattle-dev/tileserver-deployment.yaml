apiVersion: apps/v1
kind: Deployment
metadata:
  name: tileserver
spec:
  selector:
    matchLabels:
      app: tileserver
  replicas: 1
  template:
    metadata:
      labels:
        app: tileserver
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/tileserver-init:maps-earth-dev
          imagePullPolicy: Always
          volumeMounts:
            - name: tileserver-volume
              mountPath: /data
          env:
            - name: TERRAIN_ARTIFACT_SOURCE
              value: "https://data.example.com/dev/terrain-2026-08-20-d961012b.mbtiles"
            - name: TERRAIN_ARTIFACT_DEST
              value: /data/tiles/terrain.mbtiles
            - name: LANDCOVER_ARTIFACT_SOURCE
              value: "https://data.example.com/dev/landcover-2026-08-20-af6aa17e.mbtiles"
            - name: LANDCOVER_ARTIFACT_DEST
              value: /data/tiles/landcover.mbtiles
            - name: AREAMAP_ARTIFACT_SOURCE
              value: "https://data.example.com/dev/seattle-latest/Seattle-2026-08-20-c5109984.pmtiles"
            - name: AREAMAP_ARTIFACT_DEST
              value: /data/tiles/areamap.pmtiles
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 100Mi
      containers:
        - name: tileserver
          image: ghcr.io/headwaymaps/tileserver:maps-earth-dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: tileserver-volume
              mountPath: /data
          env:
            - name: PORT
              value: "8000"
          resources:
            limits:
              memory: 1500Mi
            requests:
              memory: 250Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: tileserver-volume
          persistentVolumeClaim:
            claimName: tileserver-seattle-latest-dev-2026-08-20-1546d033
