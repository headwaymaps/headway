apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentripplanner-seattle
spec:
  selector:
    matchLabels:
      app: opentripplanner-seattle
  replicas: 1
  template:
    metadata:
      labels:
        app: opentripplanner-seattle
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/opentripplanner-init:maps-earth-dev
          imagePullPolicy: Always
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /data
          env:
            - name: OTP_ARTIFACT_URL
              value: "https://data.example.com/dev/seattle-latest/transit/Seattle-seattle-graph-2026-08-20-a1b4fe0b.obj.zst"
            - name: OTP_ROUTER_CONFIG_JSON
              value: |
                {
                  "updaters": [
                    {
                      "feedId": "headway-f-c23-metrokingcounty",
                      "type": "real-time-alerts",
                      "frequency": "300s",
                      "url": "https://s3.amazonaws.com/kcm-alerts-realtime-prod/alerts.pb"
                    },
                    {
                      "feedId": "headway-f-c23-metrokingcounty",
                      "type": "stop-time-updater",
                      "frequency": "60s",
                      "url": "https://s3.amazonaws.com/kcm-alerts-realtime-prod/tripupdates.pb"
                    },
                    {
                      "feedId": "headway-f-c23-metrokingcounty",
                      "type": "vehicle-positions",
                      "frequency": "60s",
                      "url": "https://s3.amazonaws.com/kcm-alerts-realtime-prod/vehiclepositions.pb"
                    },
                    {
                      "feedId": "headway-f-c23-soundtransit",
                      "type": "real-time-alerts",
                      "frequency": "300s",
                      "url": "http://api.pugetsound.onebusaway.org/api/gtfs_realtime/alerts-for-agency/40.pb?key=${HEADWAY_GTFS_API_KEY_F_SOUNDTRANSIT_RT}"
                    },
                    {
                      "feedId": "headway-f-c23-soundtransit",
                      "type": "stop-time-updater",
                      "frequency": "60s",
                      "url": "http://api.pugetsound.onebusaway.org/api/gtfs_realtime/trip-updates-for-agency/40.pb?key=${HEADWAY_GTFS_API_KEY_F_SOUNDTRANSIT_RT}"
                    },
                    {
                      "feedId": "headway-f-c23-soundtransit",
                      "type": "vehicle-positions",
                      "frequency": "60s",
                      "url": "http://api.pugetsound.onebusaway.org/api/gtfs_realtime/vehicle-positions-for-agency/40.pb?key=${HEADWAY_GTFS_API_KEY_F_SOUNDTRANSIT_RT}"
                    },
                    {
                      "feedId": "headway-f-c28-washingtonstateferries",
                      "type": "real-time-alerts",
                      "frequency": "300s",
                      "url": "http://api.pugetsound.onebusaway.org/api/gtfs_realtime/alerts-for-agency/95.pb?key=${HEADWAY_GTFS_API_KEY_F_WSF_RT}"
                    },
                    {
                      "feedId": "headway-f-c28-washingtonstateferries",
                      "type": "stop-time-updater",
                      "frequency": "60s",
                      "url": "http://api.pugetsound.onebusaway.org/api/gtfs_realtime/trip-updates-for-agency/95.pb?key=${HEADWAY_GTFS_API_KEY_F_WSF_RT}"
                    },
                    {
                      "feedId": "headway-f-c28-washingtonstateferries",
                      "type": "vehicle-positions",
                      "frequency": "60s",
                      "url": "http://api.pugetsound.onebusaway.org/api/gtfs_realtime/vehicle-positions-for-agency/95.pb?key=${HEADWAY_GTFS_API_KEY_F_WSF_RT}"
                    }
                  ]
                }
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 128Mi
      containers:
        - name: main
          image: ghcr.io/headwaymaps/opentripplanner:maps-earth-dev
          # API keys for authenticated GTFS-RT feeds. router-config.json refers
          # to them as ${HEADWAY_GTFS_API_KEY_*}, which OTP substitutes from its
          # environment before parsing - so the config stays committable and
          # the credential lives only here.
          #
          # Optional: a zone with no authenticated realtime feeds needs no
          # secret, and shouldn't fail to start for want of one. Create it with
          # a key per variable named in the query-gtfs-index output, e.g.
          #   kubectl create secret generic otp--gtfs-api-keys \
          #     --from-literal=HEADWAY_GTFS_API_KEY_F_SF_BAY_AREA_RG_RT=...
          envFrom:
            - secretRef:
                name: otp--gtfs-api-keys
                optional: true
          env:
            - name: "JAVA_OPTS"
              # keep this in sync to be just under the resources.limits.memory
              value: "-Xmx5G"
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /var/opentripplanner
          resources:
            limits:
              # keep this in sync to be just above env.JAVA_OPTS.-Xmx
              memory: 5.25Gi
            requests:
              memory: 500Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
      volumes:
        - name: opentripplanner-volume
          persistentVolumeClaim:
            claimName: opentripplanner-seattle-seattle-latest-dev-2026-08-20-f21ba60d
