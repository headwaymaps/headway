apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentripplanner-puget-sound
spec:
  selector:
    matchLabels:
      app: opentripplanner-puget-sound
  replicas: 1
  template:
    metadata:
      labels:
        app: opentripplanner-puget-sound
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/opentripplanner-init:maps-earth-latest
          imagePullPolicy: Always
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /data
          env:
            - name: OTP_ARTIFACT_URL
              value: "https://data.example.com/0.12.0/maps-earth-planet-v1.260817/transit/maps-earth-planet-v1.260817-puget-sound-graph-2026-09-03-721aea68.obj.zst"
            - name: OTP_ROUTER_CONFIG_JSON
              value: |
                {
                  "updaters": [
                    {
                      "feedId": "headway-1080",
                      "type": "stop-time-updater",
                      "frequency": "60s",
                      "url": "https://s3.amazonaws.com/kcm-alerts-realtime-prod/tripupdates.pb"
                    },
                    {
                      "feedId": "headway-1080",
                      "type": "real-time-alerts",
                      "frequency": "300s",
                      "url": "https://s3.amazonaws.com/kcm-alerts-realtime-prod/alerts.pb"
                    }
                  ]
                }
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 128Mi
      containers:
        - name: main
          image: ghcr.io/headwaymaps/opentripplanner:maps-earth-latest
          env:
            - name: "JAVA_OPTS"
              # keep this in sync to be just under the resources.limits.memory
              value: "-Xmx5G"
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /var/opentripplanner
          resources:
            limits:
              # keep this in sync to be just above env.JAVA_OPTS.-Xmx
              memory: 5.25Gi
            requests:
              memory: 500Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
      volumes:
        - name: opentripplanner-volume
          persistentVolumeClaim:
            claimName: opentripplanner-puget-sound-maps-earth-planet-v1-260817-0-12-0-2026-09-03-20034558
