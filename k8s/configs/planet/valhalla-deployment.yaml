apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
spec:
  selector:
    matchLabels:
      app: valhalla
  replicas: 1
  template:
    metadata:
      labels:
        app: valhalla
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/valhalla-init:maps-earth-latest
          imagePullPolicy: Always
          volumeMounts:
            - name: valhalla-volume
              mountPath: /data
          env:
            - name: VALHALLA_ARTIFACT_URL
              value: "https://data.example.com/0.12.0/maps-earth-planet-v1.260817/maps-earth-planet-v1.260817-valhalla-2026-08-26-212957ca.tar.zst"
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 100Mi
      containers:
        - name: main
          image: ghcr.io/headwaymaps/valhalla:maps-earth-latest
          imagePullPolicy: Always
          ports:
          - containerPort: 8002
          volumeMounts:
          - name: valhalla-volume
            mountPath: /data
          resources:
            limits:
              memory: 8Gi
            requests:
              memory: 4Gi
      volumes:
        - name: valhalla-volume
          persistentVolumeClaim:
            claimName: valhalla-maps-earth-planet-v1-260817-0-12-0-2026-08-26-e058dc54
