                {
                  "updaters": [
                    {
                      "feedId": "headway-f-9q5-ladot",
                      "type": "real-time-alerts",
                      "frequency": "300s",
                      "url": "https://ladotbus.com/gtfs-rt/alerts"
                    },
                    {
