                      "headers": {
                        "Authorization": "${HEADWAY_GTFS_API_KEY_F_METRO_LOSANGELES_BUS_RT}"
                      }
                    },
                    {
                      "feedId": "headway-f-9q5-metro~losangeles~rail",
                      "type": "vehicle-positions",
                      "frequency": "60s",
                      "url": "https://api.goswift.ly/real-time/lametro-rail/gtfs-rt-vehicle-positions",
                      "headers": {
                        "Authorization": "${HEADWAY_GTFS_API_KEY_F_METRO_LOSANGELES_RAIL_RT}"
                      }
                    },
                    {
                      "feedId": "headway-f-9q5-metro~losangeles~rail",
                      "type": "vehicle-positions",
                      "frequency": "60s",
                      "url": "https://api.goswift.ly/real-time/lametro/gtfs-rt-vehicle-positions",
                      "headers": {
