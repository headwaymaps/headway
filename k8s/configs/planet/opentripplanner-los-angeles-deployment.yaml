                      "type": "real-time-alerts",
                      "frequency": "300s",
                      "url": "https://s3.amazonaws.com/la-alerts-prod/alerts.pb"
                    },
                    {
                      "feedId": "headway-f-9q5-metro~losangeles~rail",
                      "type": "stop-time-updater",
                      "frequency": "60s",
                      "url": "https://api.goswift.ly/real-time/lametro-rail/gtfs-rt-trip-updates",
                      "headers": {
