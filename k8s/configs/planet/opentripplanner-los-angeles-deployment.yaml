                      }
                    },
                    {
                      "feedId": "headway-f-9qh-metrolinktrains",
                      "type": "stop-time-updater",
                      "frequency": "60s",
                      "url": "https://metrolink-gtfsrt.gbsdigital.us/feed/gtfsrt-trips",
                      "headers": {
                        "X-Api-Key": "${HEADWAY_GTFS_API_KEY_F_METROLINKTRAINS_RT}"
                      }
                    },
                    {
                      "feedId": "headway-f-9qh-metrolinktrains",
                      "type": "vehicle-positions",
                      "frequency": "60s",
                      "url": "https://metrolink-gtfsrt.gbsdigital.us/feed/gtfsrt-vehicles",
                      "headers": {
                        "X-Api-Key": "${HEADWAY_GTFS_API_KEY_F_METROLINKTRAINS_RT}"
                      }
                    },
                    {
                      "feedId": "headway-f-9qh1-foothilltransit",
                      "type": "real-time-alerts",
                      "frequency": "300s",
                      "url": "https://gtfs-rt.myavail.cloud/GtfsProtoBuf?FeedLabel=Foothill&FeedType=Alerts"
                    },
                    {
                      "feedId": "headway-f-9qh1-foothilltransit",
                      "type": "stop-time-updater",
                      "frequency": "60s",
                      "url": "https://gtfs-rt.myavail.cloud/GtfsProtoBuf?FeedLabel=Foothill&FeedType=TripUpdates"
                    },
                    {
                      "feedId": "headway-f-9qh1-foothilltransit",
                      "type": "vehicle-positions",
                      "frequency": "60s",
                      "url": "https://gtfs-rt.myavail.cloud/GtfsProtoBuf?FeedLabel=Foothill&FeedType=VehiclePositions"
                    },
                    {
                      "feedId": "headway-f-laxflyaway",
                      "type": "vehicle-positions",
                      "frequency": "60s",
                      "url": "https://laxflyaway.transloc.com/subscriptions/gtfsrt/vehicles.ashx"
                    }
                  ]
                }
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 128Mi
      containers:
        - name: main
          image: ghcr.io/headwaymaps/opentripplanner:maps-earth-latest
          # API keys for authenticated GTFS-RT feeds. router-config.json refers
          # to them as ${HEADWAY_GTFS_API_KEY_*}, which OTP substitutes from its
          # environment before parsing - so the config stays committable and
          # the credential lives only here.
          #
          # Optional: a zone with no authenticated realtime feeds needs no
          # secret, and shouldn't fail to start for want of one. Create it with
          # a key per variable named in the query-gtfs-index output, e.g.
          #   kubectl create secret generic otp--gtfs-api-keys \
          #     --from-literal=HEADWAY_GTFS_API_KEY_F_SF_BAY_AREA_RG_RT=...
          envFrom:
            - secretRef:
                name: otp--gtfs-api-keys
                optional: true
          env:
            - name: "JAVA_OPTS"
              # keep this in sync to be just under the resources.limits.memory
              value: "-Xmx5G"
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /var/opentripplanner
          resources:
            limits:
              # keep this in sync to be just above env.JAVA_OPTS.-Xmx
              memory: 5.25Gi
            requests:
              memory: 500Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
      volumes:
        - name: opentripplanner-volume
          persistentVolumeClaim:
            claimName: opentripplanner-los-angeles-maps-earth-planet-v1-260817-0-12-0-2026-09-03-0addab82
