                      "type": "vehicle-positions",
                      "frequency": "60s",
                      "url": "https://api.goswift.ly/real-time/lametro/gtfs-rt-vehicle-positions",
                      "headers": {
                        "Authorization": "${HEADWAY_GTFS_API_KEY_F_METRO_LOSANGELES_BUS_RT}"
