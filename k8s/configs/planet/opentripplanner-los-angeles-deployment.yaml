apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentripplanner-los-angeles
spec:
  selector:
    matchLabels:
      app: opentripplanner-los-angeles
  replicas: 1
  template:
    metadata:
      labels:
        app: opentripplanner-los-angeles
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/opentripplanner-init:maps-earth-latest
          imagePullPolicy: Always
          volumeMounts:
