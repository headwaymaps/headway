apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias-api
spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: pelias-api
  template:
    metadata:
      labels:
        app: pelias-api
        app-group: pelias-api
      annotations:
        image: pelias/api:latest
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/pelias-init:maps-earth-dev
          imagePullPolicy: Always
          volumeMounts:
            - name: config-volume
              mountPath: /config
          env:
            - name: PELIAS_CONFIG_JSON
              value: |
                {
                  "logger": {
                    "level": "info",
                    "timestamp": false
                  },
                  "esclient": {
                    "apiVersion": "7.5",
                    "hosts": [
                      {
                        "host": "pelias-elasticsearch"
                      }
                    ]
                  },
                  "elasticsearch": {
                    "settings": {
                      "index": {
                        "refresh_interval": "10s",
                        "number_of_replicas": "0",
                        "number_of_shards": "5"
                      }
                    }
                  },
                  "api": {
                    "services": {
                      "placeholder": {
                        "url": "http://pelias-placeholder:4100"
                      },
                      "libpostal": {
                        "url": "http://pelias-libpostal:4400"
                      },
                      "pip": {
                        "url": "http://pelias-pip:4400"
                      }
                    }
                  },
                  "imports": {
                    "adminLookup": {
                      "enabled": true
                    },
                    "openstreetmap": {
                      "leveldbpath": "/tmp",
                      "datapath": "/data/openstreetmap",
                      "import": [
                        {
                          "filename": "data.osm.pbf"
                        }
                      ]
                    },
                    "whosonfirst": {
                      "datapath": "/data/whosonfirst",
                      "importPostalcodes": true
                    },
                    "polyline": {
                      "datapath": "/data/polylines",
                      "files": [
                        "extract.0sv"
                      ]
                    },
                    "openaddresses": {
                      "datapath": "/data/openaddresses",
                      "dataHost": "https://data.example.com/openaddresses"
                    }
                  }
                }
          command: ["/bin/bash", "-c", "/app/init_config.sh" ]
          resources:
            limits:
              memory: 200Mi
            requests:
              memory: 100Mi
      containers:
        - name: main
          image: pelias/api:latest
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: config-volume
              mountPath: /config
          env:
            - name: PELIAS_CONFIG
              value: "/config/pelias.json"
            - name: PORT
              value: "4000"
          resources:
            limits:
              memory: 500Mi
            requests:
              memory: 100Mi
          livenessProbe:
            httpGet:
              path: /v1/
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /v1/
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
      volumes:
        - name: config-volume
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                resources:
                  requests:
                    storage: 1Mi
