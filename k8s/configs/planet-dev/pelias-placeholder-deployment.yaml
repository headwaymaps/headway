apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias-placeholder
spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: pelias-placeholder
  template:
    metadata:
      labels:
        app: pelias-placeholder
      annotations:
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/pelias-init:maps-earth-dev
          imagePullPolicy: Always
          volumeMounts:
            - name: placeholder-volume
              mountPath: /data
            - name: config-volume
              mountPath: /config
          env:
            - name: PELIAS_CONFIG_JSON
              value: |
                {
                  "logger": {
                    "level": "info",
                    "timestamp": false
                  },
                  "esclient": {
                    "apiVersion": "7.5",
                    "hosts": [
                      {
                        "host": "pelias-elasticsearch"
                      }
                    ]
                  },
                  "elasticsearch": {
                    "settings": {
                      "index": {
                        "refresh_interval": "10s",
                        "number_of_replicas": "0",
                        "number_of_shards": "5"
                      }
                    }
                  },
                  "api": {
                    "services": {
                      "placeholder": {
                        "url": "http://pelias-placeholder:4100"
                      },
                      "libpostal": {
                        "url": "http://pelias-libpostal:4400"
                      },
                      "pip": {
                        "url": "http://pelias-pip:4400"
                      }
                    }
                  },
                  "imports": {
                    "adminLookup": {
                      "enabled": true
                    },
                    "openstreetmap": {
                      "leveldbpath": "/tmp",
                      "datapath": "/data/openstreetmap",
                      "import": [
                        {
                          "filename": "data.osm.pbf"
                        }
                      ]
                    },
                    "whosonfirst": {
                      "datapath": "/data/whosonfirst",
                      "importPostalcodes": true
                    },
                    "polyline": {
                      "datapath": "/data/polylines",
                      "files": [
                        "extract.0sv"
                      ]
                    },
                    "openaddresses": {
                      "datapath": "/data/openaddresses",
                      "dataHost": "https://data.example.com/openaddresses"
                    }
                  }
                }
            - name: PLACEHOLDER_ARTIFACT_URL
              value: "https://data.example.com/0.12.0/maps-earth-planet-v1.260817/maps-earth-planet-v1.260817-placeholder-2026-08-26-0c3310c0.tar.zst"
          command: ["/bin/bash", "-c", "/app/init_config.sh && /app/init_placeholder.sh" ]
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 200Mi
      containers:
        - name: main
          image: pelias/placeholder:latest
          ports:
            - containerPort: 4100
          volumeMounts:
            - name: placeholder-volume
              mountPath: /data
            - name: config-volume
              mountPath: /config
          env:
            - name: PLACEHOLDER_DATA
              value: "/data/placeholder/"
            - name: PORT
              value: "4100"
          resources:
            limits:
              memory: 1000Mi
            requests:
              memory: 400Mi
          livenessProbe:
            httpGet:
              path: /demo/
              port: 4100
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /demo/
              port: 4100
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: placeholder-volume
          persistentVolumeClaim:
            claimName: placeholder-maps-earth-planet-v1-260817-0-12-0-2026-08-26-f393657b
        - name: config-volume
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                resources:
                  requests:
                    storage: 1Mi
