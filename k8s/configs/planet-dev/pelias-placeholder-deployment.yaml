apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias-placeholder
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge a new pod before retiring the old one. On a version bump the two
      # pods claim *different* PVCs, so the new one downloads its artifact while
      # the old one keeps serving. On a same-version restart the two pods share
      # one ReadWriteOnce claim, which is fine: they only read it, and the
      # scheduler will only place the new pod where that volume can attach.
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  selector:
    matchLabels:
      app: pelias-placeholder
  template:
    metadata:
      labels:
        app: pelias-placeholder
      annotations:
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/pelias-init:maps-earth-dev
          imagePullPolicy: Always
          volumeMounts:
            - name: placeholder-volume
              mountPath: /data
            - name: config-volume
              mountPath: /config
          env:
            - name: PELIAS_CONFIG_JSON
              valueFrom:
                configMapKeyRef:
                  name: deployment-config
                  key: pelias-config-json
            - name: PLACEHOLDER_ARTIFACT_URL
              valueFrom:
                configMapKeyRef:
                  name: deployment-config
                  key: placeholder-artifact-url
          command: ["/bin/bash", "-c", "/app/init_config.sh && /app/init_placeholder.sh" ]
          resources:
            limits:
              memory: 400Mi
            requests:
              memory: 200Mi
      containers:
        - name: main
          image: pelias/placeholder:latest
          ports:
            - containerPort: 4100
          volumeMounts:
            - name: placeholder-volume
              mountPath: /data
            - name: config-volume
              mountPath: /config
          env:
            - name: PLACEHOLDER_DATA
              value: "/data/placeholder/"
            - name: PORT
              value: "4100"
          resources:
            limits:
              memory: 1000Mi
            requests:
              memory: 400Mi
          livenessProbe:
            httpGet:
              path: /demo/
              port: 4100
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /demo/
              port: 4100
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: placeholder-volume
          persistentVolumeClaim:
            claimName: placeholder-maps-earth-planet-v1-260727-0-12-0
        - name: config-volume
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                resources:
                  requests:
                    storage: 1Mi
