apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentripplanner-sf-bay-area
spec:
  selector:
    matchLabels:
      app: opentripplanner-sf-bay-area
  replicas: 1
  template:
    metadata:
      labels:
        app: opentripplanner-sf-bay-area
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/opentripplanner-init:maps-earth-dev
          imagePullPolicy: Always
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /data
          env:
            - name: OTP_ARTIFACT_URL
              value: "https://data.example.com/0.12.0/maps-earth-planet-v1.260817/transit/maps-earth-planet-v1.260817-sf-bay-area-graph-2026-09-03-141eb55d.obj.zst"
            - name: OTP_ROUTER_CONFIG_JSON
              value: |
                {
                  "updaters": [
                    {
                      "feedId": "headway-f-sf~bay~area~rg",
                      "type": "real-time-alerts",
                      "frequency": "300s",
                      "url": "https://api.511.org/Transit/servicealerts?agency=RG&api_key=${HEADWAY_GTFS_API_KEY_F_SF_BAY_AREA_RG_RT}"
                    },
                    {
                      "feedId": "headway-f-sf~bay~area~rg",
                      "type": "stop-time-updater",
                      "frequency": "60s",
                      "url": "https://api.511.org/Transit/TripUpdates?agency=RG&api_key=${HEADWAY_GTFS_API_KEY_F_SF_BAY_AREA_RG_RT}"
                    },
                    {
                      "feedId": "headway-f-sf~bay~area~rg",
                      "type": "vehicle-positions",
                      "frequency": "60s",
                      "url": "https://api.511.org/Transit/VehiclePositions?agency=RG&api_key=${HEADWAY_GTFS_API_KEY_F_SF_BAY_AREA_RG_RT}"
                    }
                  ]
                }
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 128Mi
      containers:
        - name: main
          image: ghcr.io/headwaymaps/opentripplanner:maps-earth-dev
          # API keys for authenticated GTFS-RT feeds. router-config.json refers
          # to them as ${HEADWAY_GTFS_API_KEY_*}, which OTP substitutes from its
          # environment before parsing - so the config stays committable and
          # the credential lives only here.
          #
          # Optional: a zone with no authenticated realtime feeds needs no
          # secret, and shouldn't fail to start for want of one. Create it with
          # a key per variable named in the query-gtfs-index output, e.g.
          #   kubectl create secret generic otp--gtfs-api-keys \
          #     --from-literal=HEADWAY_GTFS_API_KEY_F_SF_BAY_AREA_RG_RT=...
          envFrom:
            - secretRef:
                name: otp--gtfs-api-keys
                optional: true
          env:
            - name: "JAVA_OPTS"
              # keep this in sync to be just under the resources.limits.memory
              value: "-Xmx5G"
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /var/opentripplanner
          resources:
            limits:
              # keep this in sync to be just above env.JAVA_OPTS.-Xmx
              memory: 5.25Gi
            requests:
              memory: 500Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
      volumes:
        - name: opentripplanner-volume
          persistentVolumeClaim:
            claimName: opentripplanner-sf-bay-area-maps-earth-planet-v1-260817-0-12-0-2026-09-03-ff4145f9
