name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge_queue_gate:
    name: Verify reusable PR checks
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          base_sha=""
          base_ref=""
          group_sha=""
          pr_sha=""
          pr_number=""

          summary() {
            {
              echo "## Merge queue CI reuse"
              echo
              echo "- Decision: \`$1\`"
              echo "- Reason: $2"
              echo "- Base: \`${base_ref:-unknown}@${base_sha:-unknown}\`"
              echo "- Merge-group head: \`${group_sha:-unknown}\`"
              if [ -n "$pr_sha" ]; then
                echo "- PR: #${pr_number:-unknown} at \`${pr_sha}\`"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          reject() {
            echo "Not reusing PR checks: $1"
            summary "full CI" "$1"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          base_sha="$(jq -r '.merge_group.base_sha // empty' "$GITHUB_EVENT_PATH")"
          base_ref="$(jq -r '.merge_group.base_ref // empty' "$GITHUB_EVENT_PATH")"
          group_sha="$(jq -r '.merge_group.head_sha // empty' "$GITHUB_EVENT_PATH")"
          [ -n "$base_sha" ] && [ -n "$base_ref" ] && [ -n "$group_sha" ] ||
            reject "merge-group payload is missing a base or head SHA"
          [ "$GITHUB_SHA" = "$group_sha" ] ||
            reject "checked-out SHA does not match the merge-group head"

          set -- $(git show -s --format=%P "$group_sha")
          [ "$#" -eq 2 ] || reject "merge-group commit does not contain exactly one PR"
          [ "$1" = "$base_sha" ] || reject "merge-group first parent is not its base SHA"
          pr_sha="$2"

          prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$pr_sha/pulls")" ||
            reject "could not find pull requests associated with the merge commit"
          pr_count="$(jq --arg base_ref "$base_ref" --arg base_sha "$base_sha" --arg pr_sha "$pr_sha" \
            '[.[] | select(
              .state == "open"
              and .base.ref == $base_ref
              and .base.sha == $base_sha
              and .head.sha == $pr_sha
            )] | length' <<<"$prs")"
          [ "$pr_count" -eq 1 ] ||
            reject "merge-group commit is not exactly one open PR tested against this base"
          pr_number="$(jq --arg base_ref "$base_ref" --arg base_sha "$base_sha" --arg pr_sha "$pr_sha" \
            '[.[] | select(
              .state == "open"
              and .base.ref == $base_ref
              and .base.sha == $base_sha
              and .head.sha == $pr_sha
            )][0].number' <<<"$prs")"

          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$pr_sha/check-runs?per_page=100")" ||
            reject "could not inspect checks on the PR head"
          has_passing_checks="$(jq \
            '[.check_runs[] | select(
              .name == "All checks"
              and .conclusion == "success"
              and .app.slug == "github-actions"
              and (.details_url | contains("/actions/runs/"))
            )] | length > 0' <<<"$checks")"
          [ "$has_passing_checks" = true ] ||
            reject "the matching PR head has no passing GitHub Actions All checks run"

          echo "Reusing completed PR checks for $pr_sha on unchanged base $base_sha"
          summary "reused PR checks" "single PR already passed All checks on the unchanged base"
          echo "reuse=true" >> "$GITHUB_OUTPUT"

  # Add any new jobs to "needs" to include it in GH's CI requirements
  all_checks:
    name: All checks
    if: always()
    needs:
      - merge_queue_gate
      - build_data
      - build_images
      - www_checks
      - rust_checks
      - integration_tests
      - browser_tests
    runs-on: ubuntu-latest
    steps:
      - name: Report each job's result
        run: |
          echo "merge_queue_gate:  ${{ needs.merge_queue_gate.result }}"
          echo "build_data:         ${{ needs.build_data.result }}"
          echo "build_images:       ${{ needs.build_images.result }}"
          echo "www_checks:         ${{ needs.www_checks.result }}"
          echo "rust_checks:        ${{ needs.rust_checks.result }}"
          echo "integration_tests:  ${{ needs.integration_tests.result }}"
          echo "browser_tests:      ${{ needs.browser_tests.result }}"
      # Anything that isn't a success fails this job, skipped included: a check
      # that didn't run is not a check that passed.
      - name: Fail unless every job succeeded
        if: >-
          ${{ (github.event_name == 'merge_group'
               && needs.merge_queue_gate.result != 'success')
           || contains(needs.*.result, 'failure')
           || contains(needs.*.result, 'cancelled')
           || (needs.merge_queue_gate.outputs.reuse != 'true'
               && (needs.build_data.result == 'skipped'
                   || needs.build_images.result == 'skipped'
                   || needs.www_checks.result == 'skipped'
                   || needs.rust_checks.result == 'skipped'
                   || needs.integration_tests.result == 'skipped'
                   || needs.browser_tests.result == 'skipped')) }}
        run: exit 1
  build_data:
    name: Build Bogota data artifacts
    needs: [merge_queue_gate]
    if: >-
      ${{ always() && (github.event_name != 'merge_group'
          || needs.merge_queue_gate.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    env:
      DAGGER_NO_NAG: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "latest"
      - name: Copy .bin-env
        run: cp .bin-env-example .bin-env
      - name: Build data artifacts
        run: bin/build builds/Bogota
      - name: Upload data artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bogota-artifacts-${{ github.sha }}
          path: data/Bogota
          retention-days: 7
      # The build re-pins artifacts.json to the names it just built, so the
      # committed manifest is stale for dated artifacts (otp graphs, gtfs,
      # elevation). Downstream jobs need this copy, not the checked-out one.
      - name: Upload artifact manifest
        uses: actions/upload-artifact@v7
        with:
          name: bogota-manifest-${{ github.sha }}
          path: builds/Bogota/artifacts.json
          retention-days: 7
  build_images:
    name: Build service images
    needs: [merge_queue_gate]
    if: >-
      ${{ always() && (github.event_name != 'merge_group'
          || needs.merge_queue_gate.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "latest"
      - name: Build service images
        run: bin/build-images
      - name: Save Docker images
        run: docker save $(docker images --format "{{.Repository}}:{{.Tag}}" | grep headway) > docker-images.tar
      - name: Upload Docker images
        uses: actions/upload-artifact@v7
        with:
          name: docker-images-${{ github.sha }}
          path: docker-images.tar
          compression-level: 0
          retention-days: 7
  www_checks:
    needs: [merge_queue_gate]
    if: >-
      ${{ always() && (github.event_name != 'merge_group'
          || needs.merge_queue_gate.outputs.reuse != 'true') }}
    defaults:
      run:
        working-directory: services/frontend/www-app
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global yarn
      - run: yarn install
      - run: yarn quasar prepare
      - run: yarn lint
      - run: yarn format-check
      - run: yarn tsc
      - run: yarn test
  rust_checks:
    needs: [merge_queue_gate]
    if: >-
      ${{ always() && (github.event_name != 'merge_group'
          || needs.merge_queue_gate.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --workspace --release --all-features
  integration_tests:
    name: Integration Tests
    needs: [merge_queue_gate, build_data, build_images]
    if: >-
      ${{ always() && (github.event_name != 'merge_group'
          || needs.merge_queue_gate.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Download data artifacts
        uses: actions/download-artifact@v8
        with:
          name: bogota-artifacts-${{ github.sha }}
          path: data/Bogota
      - name: Download artifact manifest
        uses: actions/download-artifact@v8
        with:
          name: bogota-manifest-${{ github.sha }}
          path: builds/Bogota
      - name: Download Docker images
        uses: actions/download-artifact@v8
        with:
          name: docker-images-${{ github.sha }}
          path: .
      - name: Load Docker images
        run: docker load < docker-images.tar
      - name: Run integration tests
        run: tests/integration/run-integration-tests.sh
      - name: Collect logs on failure
        if: failure()
        run: bin/docker-compose builds/Bogota logs > integration-test-logs.txt
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs
          path: integration-test-logs.txt
  browser_tests:
    name: Browser Tests
    needs: [merge_queue_gate, build_data, build_images]
    if: >-
      ${{ always() && (github.event_name != 'merge_group'
          || needs.merge_queue_gate.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global yarn
      - name: Install Playwright and Chrome
        working-directory: tests/browser
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chrome
      - name: Download data artifacts
        uses: actions/download-artifact@v8
        with:
          name: bogota-artifacts-${{ github.sha }}
          path: data/Bogota
      - name: Download artifact manifest
        uses: actions/download-artifact@v8
        with:
          name: bogota-manifest-${{ github.sha }}
          path: builds/Bogota
      - name: Download Docker images
        uses: actions/download-artifact@v8
        with:
          name: docker-images-${{ github.sha }}
          path: .
      - name: Load Docker images
        run: docker load < docker-images.tar
      - name: Start services
        run: bin/start-services --no-follow-logs builds/Bogota
      - name: Wait for services
        run: bin/wait-for-services
      - name: Run browser tests
        run: tests/browser/run.sh
      - name: Collect logs on failure
        if: failure()
        run: bin/docker-compose builds/Bogota logs > browser-test-logs.txt
      - name: Upload logs and Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-artifacts
          path: |
            browser-test-logs.txt
            tests/browser/playwright-report/
            tests/browser/test-results/
      - name: Stop services
        if: always()
        run: bin/stop-and-remove-services builds/Bogota
