worker_processes auto;

events {
  worker_connections 4096;
}

http {
  index index.html;
  root /usr/share/nginx/html/;
  include mime.types;
  sendfile on;
  access_log off;

  gzip on;
  gzip_types application/json application/javascript text/css;

  proxy_http_version 1.1;
  absolute_redirect off;

  # What to append to a request's query to turn on the frontend's debug tools, if they aren't.
  map $args $debug_args {
    "" "?debug";
    "~(^|&)debug(=|&|$)" "";
    default "&debug";
  }

  # Variable upstreams are resolved per request, so nginx starts regardless of their state.
  resolver 127.0.0.11 valid=30s;

  server {
    listen 8080 default_server;

    location = / {
      return 302 /compare-directions/bicycle/47.728%2C-122.3175/47.712%2C-122.3175?debug;
    }

    location /travelmux/ {
      set $travelmux http://travelmux:8000;
      rewrite ^/travelmux/(.*)$ /$1 break;
      proxy_pass $travelmux;
    }

    # Compared directions always show the debug tools.
    location /compare-directions/ {
      if ($debug_args) {
        return 302 $request_uri$debug_args;
      }
      try_files $uri /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/(tileserver|pelias)/ {
      set $maps_earth https://maps.earth;
      proxy_ssl_server_name on;
      proxy_ssl_name maps.earth;
      proxy_set_header Host maps.earth;
      proxy_pass $maps_earth;
    }

    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:css|js|mjs|jpg|png|svg|woff|woff2)$ {
      expires 30d;
      add_header Cache-Control "public";
    }
  }
}
