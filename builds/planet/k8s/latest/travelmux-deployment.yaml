apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelmux
spec:
  selector:
    matchLabels:
      app: travelmux
  replicas: 1
  template:
    metadata:
      labels:
        app: travelmux
    spec:
      containers:
        - name: main
          image: ghcr.io/headwaymaps/travelmux:maps-earth-latest
          imagePullPolicy: Always
          args: ["--otp=London=http://opentripplanner-london:8000","--otp=Los Angeles=http://opentripplanner-los-angeles:8000","--otp=Portland=http://opentripplanner-portland:8000","--otp=Puget Sound (Seattle Area)=http://opentripplanner-puget-sound:8000","--otp=San Francisco Bay Area=http://opentripplanner-sf-bay-area:8000","--valhalla=valhalla=http://valhalla:8002"]
          ports:
            - containerPort: 8000
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health/alive
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 10
