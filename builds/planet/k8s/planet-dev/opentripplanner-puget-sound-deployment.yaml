apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentripplanner-puget-sound
spec:
  selector:
    matchLabels:
      app: opentripplanner-puget-sound
  replicas: 1
  template:
    metadata:
      labels:
        app: opentripplanner-puget-sound
      annotations:
        # Roll the pod if the zone file changes
        headway/zone-checksum: "a4e605fc80b8"
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/opentripplanner-init:maps-earth-dev
          imagePullPolicy: Always
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /data
            # The init container renders router-config.json from these two, so
            # the live tokens stay out of this manifest.
            - name: zone
              mountPath: /run/config
              readOnly: true
            - name: gtfs-secrets
              mountPath: /run/secrets
              readOnly: true
          env:
            - name: OTP_ARTIFACT_URL
              value: "https://data.example.com/0.12.0/maps-earth-planet-v1.260817/transit/maps-earth-planet-v1.260817-puget-sound-graph-2026-09-10-2a5ecc91.obj.zst"
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 128Mi
      containers:
        - name: main
          image: ghcr.io/headwaymaps/opentripplanner:maps-earth-dev
          env:
            - name: "JAVA_OPTS"
              value: "-Xmx5G"
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /var/opentripplanner
          resources:
            limits:
              memory: 5.25Gi
            requests:
              memory: 500Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
      volumes:
        - name: zone
          configMap:
            name: otp-puget-sound-zone
        - name: gtfs-secrets
          secret:
            secretName: otp-puget-sound-gtfs-secrets
            optional: false
        - name: opentripplanner-volume
          persistentVolumeClaim:
            claimName: opentripplanner-puget-sound-maps-earth-planet-v1-260817-0-12-0-2026-09-10-3c94fb4f
