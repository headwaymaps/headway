apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentripplanner-sf-bay-area
spec:
  selector:
    matchLabels:
      app: opentripplanner-sf-bay-area
  replicas: 1
  template:
    metadata:
      labels:
        app: opentripplanner-sf-bay-area
      annotations:
        # Roll the pod if the zone file changes
        headway/zone-checksum: "7d1accc94de6"
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/opentripplanner-init:maps-earth-latest
          imagePullPolicy: Always
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /data
            - name: zone
              mountPath: /run/config
              readOnly: true
            - name: gtfs-secrets
              mountPath: /var/run/secrets/maps.earth
              readOnly: true
          env:
            - name: OTP_ARTIFACT_URL
              value: "https://data.example.com/0.13.0/maps-earth-planet-v1.260817/transit/maps-earth-planet-v1.260817-sf-bay-area-graph-2026-09-17-4a49362c.obj.zst"
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 128Mi
      containers:
        - name: main
          image: ghcr.io/headwaymaps/opentripplanner:maps-earth-latest
          env:
            - name: "JAVA_OPTS"
              # keep this in sync to be just under the resources.limits.memory
              value: "-Xmx7G"
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /var/opentripplanner
          resources:
            limits:
              # keep this in sync to be just above env.JAVA_OPTS.-Xmx
              memory: 7.25Gi
            requests:
              memory: 500Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
      volumes:
        - name: zone
          configMap:
            name: otp-sf-bay-area-zone
        - name: gtfs-secrets
          secret:
            secretName: otp-sf-bay-area-gtfs-secrets
            optional: false
        - name: opentripplanner-volume
          persistentVolumeClaim:
            claimName: opentripplanner-sf-bay-area-maps-earth-planet-v1-260817-0-13-0-2026-09-17-4543ce30
