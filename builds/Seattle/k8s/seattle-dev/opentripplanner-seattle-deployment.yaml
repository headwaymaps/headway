apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentripplanner-seattle
spec:
  selector:
    matchLabels:
      app: opentripplanner-seattle
  replicas: 1
  template:
    metadata:
      labels:
        app: opentripplanner-seattle
      annotations:
        # Roll the pod if the zone file changes
        headway/zone-checksum: "fd5fb249cc15"
    spec:
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/opentripplanner-init:maps-earth-dev
          imagePullPolicy: Always
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /data
            - name: zone
              mountPath: /run/config
              readOnly: true
            - name: gtfs-secrets
              mountPath: /var/run/secrets/maps.earth
              readOnly: true
          env:
            - name: OTP_ARTIFACT_URL
              value: "https://data.example.com/dev/seattle-latest/transit/Seattle-seattle-graph-2026-09-17-b157c2b8.obj.zst"
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 128Mi
      containers:
        - name: main
          image: ghcr.io/headwaymaps/opentripplanner:maps-earth-dev
          env:
            - name: "JAVA_OPTS"
              # keep this in sync to be just under the resources.limits.memory
              value: "-Xmx5G"
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: opentripplanner-volume
              mountPath: /var/opentripplanner
          resources:
            limits:
              # keep this in sync to be just above env.JAVA_OPTS.-Xmx
              memory: 5.25Gi
            requests:
              memory: 500Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
      volumes:
        - name: zone
          configMap:
            name: otp-seattle-zone
        - name: gtfs-secrets
          secret:
            secretName: otp-seattle-gtfs-secrets
            optional: false
        - name: opentripplanner-volume
          persistentVolumeClaim:
            claimName: opentripplanner-seattle-seattle-latest-dev-2026-09-17-eab90125
