apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias-elasticsearch
spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: pelias-elasticsearch
  template:
    metadata:
      labels:
        app: pelias-elasticsearch
    spec:
      volumes:
        - name: elasticsearch-volume
          persistentVolumeClaim:
            claimName: elasticsearch-seattle-latest-dev-2026-10-31-43b25910
        # Elasticsearch's writes, layered over the read-only index image.
        - name: elasticsearch-scratch
          emptyDir: {}
        - name: config-volume
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                resources:
                  requests:
                    storage: 1Mi
      initContainers:
        - name: init
          image: ghcr.io/headwaymaps/pelias-init:maps-earth-dev
          imagePullPolicy: Always
          volumeMounts:
            - name: elasticsearch-volume
              mountPath: /index
            - name: config-volume
              mountPath: /config
          env:
            - name: PELIAS_CONFIG_JSON
              value: |
                {
                  "logger": {
                    "level": "info",
                    "timestamp": false
                  },
                  "esclient": {
                    "apiVersion": "7.5",
                    "hosts": [
                      {
                        "host": "pelias-elasticsearch"
                      }
                    ]
                  },
                  "elasticsearch": {
                    "settings": {
                      "index": {
                        "refresh_interval": "10s",
                        "number_of_replicas": "0",
                        "number_of_shards": "5",
                        "codec": "best_compression"
                      }
                    }
                  },
                  "api": {
                    "services": {
                      "placeholder": {
                        "url": "http://pelias-placeholder:4100"
                      },
                      "libpostal": {
                        "url": "http://pelias-libpostal:4400"
                      },
                      "pip": {
                        "url": "http://pelias-pip:4400"
                      }
                    }
                  },
                  "imports": {
                    "adminLookup": {
                      "enabled": true
                    },
                    "openstreetmap": {
                      "leveldbpath": "/tmp",
                      "datapath": "/data/openstreetmap",
                      "import": [
                        {
                          "filename": "data.osm.pbf"
                        }
                      ]
                    },
                    "whosonfirst": {
                      "datapath": "/data/whosonfirst",
                      "importPostalcodes": true,
                      "countryCode": [
                        "US"
                      ]
                    },
                    "polyline": {
                      "datapath": "/data/polylines",
                      "files": [
                        "extract.0sv"
                      ]
                    },
                    "openaddresses": {
                      "datapath": "/data/openaddresses",
                      "files": [
                        "us/wa/king.csv"
                      ]
                    }
                  }
                }
            - name: ELASTICSEARCH_ARTIFACT_URL
              value: "https://data.example.com/dev/seattle-latest/Seattle-elasticsearch-2026-10-31-cca1e993.erofs.zst"
          command: ["/bin/bash", "-c", "/app/init_config.sh && /app/init_elastic.sh" ]
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 200Mi
      containers:
        - name: main
          image: ghcr.io/headwaymaps/pelias-elasticsearch:maps-earth-dev
          imagePullPolicy: Always
          # to mount the index image
          securityContext:
            privileged: true
          volumeMounts:
            - name: elasticsearch-volume
              mountPath: /index
              readOnly: true
            - name: elasticsearch-scratch
              mountPath: /scratch
            - name: config-volume
              mountPath: /config
          ports:
            - containerPort: 9200
          env:
            - name: ES_JAVA_OPTS
              value: "-Xmx8g"
          resources:
            limits:
              memory: 16Gi
            requests:
              memory: 750Mi
          livenessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 50
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow
              port: 9200
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 50
