base_path: "/tileserver"
cache_size_mb: 1024
pmtiles:
  sources:
    areamap-mlt:
      path: ../../data/Bogota/Bogota.pmtiles
      output_format: mlt
      convert_to_mlt:
        allow_shared_dict: false
        allow_fastpfor: false
    areamap-mvt:
      path: ../../data/Bogota/Bogota.pmtiles
      output_format: mvt
mbtiles:
  sources:
    landcover: ../../data/Bogota/landcover.mbtiles
    terrain: ../../data/Bogota/terrain.mbtiles
styles:
  paths: ['./assets/styles']
sprites:
  paths: ['./assets/sprites']
fonts:
  paths: ['./assets/fonts']
