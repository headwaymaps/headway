[package]
name = "gtfout"
version = "0.1.0"
edition = "2021"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.2.1"
geo-types = "0.7.20"
geopackage = "0.8.0"
log = "0.4.19"
pretty_env_logger = "0.5.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "charset", "http2", "query"] }
serde = { version = "1.0.158", features = ["derive"] }
serde_json = "1.0.151"
zip = "8.6.0"
